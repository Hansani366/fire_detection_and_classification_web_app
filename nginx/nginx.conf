events { worker_connections 1024; }

http {
    # HTTP → HTTPS redirect
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Allow frame uploads up to 10 MB
        client_max_body_size 10M;

        # Detection frames stay on the frontend proxy (→ YOLO / VLM).
        # Exact matches (=) beat the /api/ prefix, so only these two do.
        location = /api/detect {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
        location = /api/describe {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 65s;
        }

        # Tier 1a: sensor readings -> a plain-language warning. Text-only, so it
        # needs nothing like the VLM's 65s. Exact match, or the /api/ catch-all
        # below would send it to alert-service and 404.
        # Same precedence rule as the others: an exact match, so the /api/
        # catch-all further down does not swallow it into alert-service.
        location = /api/describe-scene {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 65s;
        }

        location = /api/warn {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 20s;
        }

        # ESP32-CAM bridge. A longer prefix than /api/, so it wins over the
        # alert-service block below. The MJPEG feed is an endless chunked
        # response, so it needs HTTP/1.1 and no buffering — nginx's defaults
        # (HTTP/1.0 + proxy_buffering on) stall it.
        location /api/esp32/ {
            proxy_pass              http://esp32-cam-service:8021;
            proxy_set_header        Host      $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_read_timeout      24h;
            proxy_send_timeout      24h;
        }

        # ESP32 sensor telemetry. Like /api/esp32/ this is a longer prefix than
        # /api/, so nginx picks it over the alert-service block below. Plain
        # JSON — none of the streaming exceptions the camera bridge needs.
        # (The boards themselves POST to the published :8022, not through here;
        # this route exists so the HTTPS dashboard can read same-origin.)
        location /api/sensors/ {
            proxy_pass         http://esp32-sensor-service:8022;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # Ablation testing. Another longer-than-/api/ prefix, so it wins over
        # the alert-service block below — a bare /api/ablate would silently
        # land on alert-service and 404 there instead.
        #
        # Two overrides of the server-wide defaults: a batch run over real
        # recordings spends minutes waiting on Gemini, well past the 30s every
        # other route uses; and although recordings are bind-mounted rather
        # than uploaded, the window-level CSV export of a long run is far
        # larger than the 10M body cap.
        location /api/ablation/ {
            proxy_pass           http://ablation-service:8023;
            proxy_set_header     Host      $host;
            proxy_set_header     X-Real-IP $remote_addr;
            client_max_body_size 512M;
            proxy_read_timeout   600s;
            proxy_send_timeout   600s;
        }

        # Fire classification — the service that owns the trained models. The
        # dashboard asks it what is burning once a fire is already confirmed.
        # Another longer-than-/api/ prefix, so it beats the catch-all below.
        location /api/classify/ {
            proxy_pass         http://fire-classification-service:8024;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            # A tick can spend a Gemini call inside it, so it needs more than
            # the 30s the plain JSON routes use.
            proxy_read_timeout 90s;
        }

        # Everything else under /api/ is the mobile app / event API → alert-service.
        # (Lets the browser dashboard POST /api/events/fire same-origin over HTTPS.)
        location /api/ {
            proxy_pass         http://alert-service:8090;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # The browser dashboard (static UI).
        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 30s;
        }
    }
}