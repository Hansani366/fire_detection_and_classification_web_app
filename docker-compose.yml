services:

  # ── Fire & Smoke Detection (YOLO11) ───────────────────────────
  # Drives the alarm: its boxes are what the VLM is asked to confirm.
  fire-detection-yolo-service:
    build: ./fire-detection-yolo-service
    container_name: firewatch-fire-yolo
    restart: unless-stopped
    expose:
      - "8000"

  # ── Human Detection (YOLO11s / CrowdHuman) ────────────────────
  # Occupancy counting. Scored on the same frame as the fire detector but in a
  # separate container so the two run concurrently — wall-clock cost is
  # max(fire, human), not the sum — and so a failure here can never stall or
  # crash the alarm path. The frontend proxy treats it as strictly optional.
  human-detection-yolo-service:
    build: ./human-detection-yolo-service
    container_name: firewatch-human-yolo
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      # Counting is more threshold-sensitive than alarming — every surviving
      # box is +1 person on an evacuation head-count.
      - HUMAN_MIN_CONF=${HUMAN_MIN_CONF:-0.40}

  # ── VLM Vision Service ────────────────────────────────────────
  vlm-service:
    build: ./vlm-service
    container_name: firewatch-vlm
    restart: unless-stopped
    expose:
      - "8019"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

  # ── ESP32-CAM Bridge ──────────────────────────────────────────
  # Same-origin proxy for the board's MJPEG stream. The dashboard is HTTPS, so it
  # cannot load http://<board-ip>/stream directly (mixed content) and a cross-origin
  # <img> would taint the capture canvas.
  esp32-cam-service:
    build: ./esp32-cam-service
    container_name: firewatch-esp32-cam
    restart: unless-stopped
    expose:
      - "8021"
    environment:
      - ESP32_CAM_URL=${ESP32_CAM_URL:-}

  # ── ESP32 Sensor Bridge ───────────────────────────────────────
  # Receives telemetry pushed by the sensor nodes (MQ-2 / MQ-7 / IR flame /
  # DHT22) and serves the latest sweep to the dashboard.
  # Publishes :8022 directly so the boards can POST over plain HTTP on the LAN
  # — same reasoning as alert-service:8090, an ESP32 should not have to accept
  # nginx's self-signed cert. Browsers reach it through nginx over HTTPS.
  esp32-sensor-service:
    build: ./esp32-sensor-service
    container_name: firewatch-esp32-sensors
    restart: unless-stopped
    expose:
      - "8022"
    ports:
      - "8022:8022"
    environment:
      - SENSOR_STALE_AFTER_S=15    # no sample for this long → node reported stale
      - SENSOR_HISTORY_MAX=720     # samples kept per node (≈36 min at 3s)
      - SENSOR_INGEST_KEY=${SENSOR_INGEST_KEY:-}   # empty = accept any LAN device
      - SENSOR_MQ2_WARN=400
      - SENSOR_MQ2_DANGER=800
      - SENSOR_MQ7_WARN=35         # OSHA 8-hour CO ceiling
      - SENSOR_MQ7_DANGER=100
      - SENSOR_TEMP_WARN=45
      - SENSOR_TEMP_DANGER=60

  # ── HTML/JS Frontend ──────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: firewatch-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - FIRE_YOLO_URL=http://fire-detection-yolo-service:8000/detect
      - HUMAN_YOLO_URL=http://human-detection-yolo-service:8001/detect
      - GEMINI_URL=http://vlm-service:8019/describe-image/
    depends_on:
      - fire-detection-yolo-service
      - human-detection-yolo-service
      - vlm-service

  # ── Fire Classification Service ───────────────────────────────
  # THE ONE PLACE THE TRAINED MODELS LIVE. sensor_model.joblib and
  # fusion_model.joblib are loaded here and nowhere else; the dashboard and
  # ablation-service both ask this service for a verdict. One copy of the
  # weights, one set of pinned versions, and no way for the live system and the
  # research page to disagree about the same fire.
  #
  # ITS OWN IMAGE ON PURPOSE. It pins scikit-learn/xgboost/pandas to the exact
  # versions that wrote the pickles, which want numpy>=2 — while the two YOLO
  # services pin numpy<2 for the OpenCV/torch ABI. The two sets cannot share an
  # image.
  fire-classification-service:
    build: ./fire-classification-service
    container_name: firewatch-classifier
    restart: unless-stopped
    expose:
      - "8024"
    environment:
      - FIRE_YOLO_URL=http://fire-detection-yolo-service:8000/detect
      - VLM_DETAILED_URL=http://vlm-service:8019/describe-image-detailed/
      - SENSOR_LATEST_URL=http://esp32-sensor-service:8022/api/sensors/latest
    depends_on:
      - fire-detection-yolo-service
      - vlm-service
      - esp32-sensor-service

  # ── Ablation Testing Service ──────────────────────────────────
  # Scores one observation stream through six sensing combinations at once, for
  # the research paper's ablation table. Holds the rules and the metrics; asks
  # fire-classification-service for the two trained arms.
  ablation-service:
    build: ./ablation-service
    container_name: firewatch-ablation
    restart: unless-stopped
    expose:
      - "8023"
    environment:
      - CLASSIFIER_URL=http://fire-classification-service:8024
      - FIRE_YOLO_URL=http://fire-detection-yolo-service:8000/detect
      - VLM_DETAILED_URL=http://vlm-service:8019/describe-image-detailed/
      - SENSOR_LATEST_URL=http://esp32-sensor-service:8022/api/sensors/latest
    volumes:
      # Real recordings are bind-mounted rather than uploaded: nginx caps
      # bodies at 10M, and a recording is thousands of frames. Read-only, so a
      # run can never modify its own input.
      - ./ablation-data:/data:ro
    depends_on:
      # Ordering only — Compose does not wait for readiness, and this service
      # loads two models before it answers. ablation-service retries on
      # startup rather than assuming it is up.
      - fire-classification-service
      - fire-detection-yolo-service
      - vlm-service
      - esp32-sensor-service

  # ── Mobile Alert Service (FCM push + app state) ───────────────
  # Holds zones/incidents/history, receives confirmed-fire events, sends push.
  # Publishes :8090 directly so the phone app can reach it over plain HTTP on
  # the LAN (avoids the self-signed-cert dance a native client hits via nginx).
  alert-service:
    build: ./alert-service
    container_name: firewatch-alert
    restart: unless-stopped
    expose:
      - "8090"
    ports:
      - "8090:8090"
    environment:
      - FIREBASE_CREDENTIALS=/secrets/firebase-sa.json
      - DB_PATH=/data/alert.db
      # Which facility to load from alert-service/sites/. `unit7` is the demo
      # hall; `home` is the trial facility. This picks the zone catalogue AND the
      # evacuation graph together, so the two cannot describe different buildings.
      - SITE_KEY=unit7
      # Display name only. Leave unset to use the site file's own name.
      - SITE_NAME=Unit 7
      # Blank = use the radius in the site file (6 m for unit7, 2 m for home).
      # Set it to retune live -- but note env is read at CONTAINER START, so use
      # `up -d --force-recreate alert-service`; a plain `restart` keeps the old value.
      - HAZARD_RADIUS_M=
      - COOLDOWN_SECONDS=120     # min seconds between separate incidents in one zone
      - CLEAR_AFTER_SECONDS=30   # no fire event for this long → auto-clear the incident
    volumes:
      - ./alert-service/secrets:/secrets:ro   # drop firebase-sa.json in here to enable push
      - alert-data:/data                      # SQLite lives here (survives restarts)
    depends_on:
      - fire-detection-yolo-service
      - vlm-service

  # ── HTTPS Reverse Proxy ───────────────────────────────────────
  # Certs are generated automatically during `docker compose build`.
  # No manual cert generation needed.
  nginx:
    build: ./nginx
    container_name: firewatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"    # redirects → HTTPS
      - "443:443"  # open https://localhost
    depends_on:
      - frontend
      - alert-service
      - esp32-cam-service
      - esp32-sensor-service
      # Not optional: nginx resolves proxy_pass hostnames at config load and
      # has no resolver, so a missing upstream stops nginx starting at all —
      # taking the whole stack down, not just that one route.
      - ablation-service
      - fire-classification-service

volumes:
  alert-data: