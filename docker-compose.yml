services:

  # ── YOLO Detection Service ────────────────────────────────────
  yolo-service:
    build: ./yolo-service
    container_name: firewatch-yolo
    restart: unless-stopped
    expose:
      - "8000"

  # ── VLM Vision Service ────────────────────────────────────────
  vlm-service:
    build: ./vlm-service
    container_name: firewatch-vlm
    restart: unless-stopped
    expose:
      - "8019"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

  # ── ESP32-CAM Bridge ──────────────────────────────────────────
  # Same-origin proxy for the board's MJPEG stream. The dashboard is HTTPS, so it
  # cannot load http://<board-ip>/stream directly (mixed content) and a cross-origin
  # <img> would taint the capture canvas.
  esp32-service:
    build: ./esp32-service
    container_name: firewatch-esp32
    restart: unless-stopped
    expose:
      - "8021"
    environment:
      - ESP32_CAM_URL=${ESP32_CAM_URL:-}

  # ── ESP32 Sensor Bridge ───────────────────────────────────────
  # Receives telemetry pushed by the sensor nodes (MQ-2 / MQ-7 / IR flame /
  # DHT22) and serves the latest sweep to the dashboard.
  # Publishes :8022 directly so the boards can POST over plain HTTP on the LAN
  # — same reasoning as alert-service:8090, an ESP32 should not have to accept
  # nginx's self-signed cert. Browsers reach it through nginx over HTTPS.
  sensor-service:
    build: ./sensor-service
    container_name: firewatch-sensors
    restart: unless-stopped
    expose:
      - "8022"
    ports:
      - "8022:8022"
    environment:
      - SENSOR_STALE_AFTER_S=15    # no sample for this long → node reported stale
      - SENSOR_HISTORY_MAX=720     # samples kept per node (≈36 min at 3s)
      - SENSOR_INGEST_KEY=${SENSOR_INGEST_KEY:-}   # empty = accept any LAN device
      - SENSOR_MQ2_WARN=400
      - SENSOR_MQ2_DANGER=800
      - SENSOR_MQ7_WARN=35         # OSHA 8-hour CO ceiling
      - SENSOR_MQ7_DANGER=100
      - SENSOR_TEMP_WARN=45
      - SENSOR_TEMP_DANGER=60

  # ── HTML/JS Frontend ──────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: firewatch-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - YOLO_URL=http://yolo-service:8000/detect
      - GEMINI_URL=http://vlm-service:8019/describe-image/
    depends_on:
      - yolo-service
      - vlm-service

  # ── Mobile Alert Service (FCM push + app state) ───────────────
  # Holds zones/incidents/history, receives confirmed-fire events, sends push.
  # Publishes :8090 directly so the phone app can reach it over plain HTTP on
  # the LAN (avoids the self-signed-cert dance a native client hits via nginx).
  alert-service:
    build: ./alert-service
    container_name: firewatch-alert
    restart: unless-stopped
    expose:
      - "8090"
    ports:
      - "8090:8090"
    environment:
      - FIREBASE_CREDENTIALS=/secrets/firebase-sa.json
      - DB_PATH=/data/alert.db
      - SITE_NAME=Unit 7
      - COOLDOWN_SECONDS=120     # min seconds between separate incidents in one zone
      - CLEAR_AFTER_SECONDS=30   # no fire event for this long → auto-clear the incident
    volumes:
      - ./alert-service/secrets:/secrets:ro   # drop firebase-sa.json in here to enable push
      - alert-data:/data                      # SQLite lives here (survives restarts)
    depends_on:
      - yolo-service
      - vlm-service

  # ── HTTPS Reverse Proxy ───────────────────────────────────────
  # Certs are generated automatically during `docker compose build`.
  # No manual cert generation needed.
  nginx:
    build: ./nginx
    container_name: firewatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"    # redirects → HTTPS
      - "443:443"  # open https://localhost
    depends_on:
      - frontend
      - alert-service
      - esp32-service
      - sensor-service

volumes:
  alert-data: